name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v5.3.1)"
        required: true
        default: "v5.3.1"
      linux_only:
        description: "Build and validate Linux artifacts only; do not update the release"
        type: boolean
        default: false
      build_only:
        description: "Build packages without modifying an existing release draft"
        type: boolean
        default: false
      windows_only:
        description: "Build Windows packages only without updating the release"
        type: boolean
        default: false
      android_only:
        description: "Build Android packages only without updating the release"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SPOTIFLAC_DISTRIBUTION_REPO: ${{ vars.DISTRIBUTION_REPO || 'spotiflac-app/spotiflac-releases' }}
  SPOTIFLAC_DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
  SPOTIFLAC_DISCORD_CLIENT_ID: ${{ vars.DISCORD_APPLICATION_ID }}

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require full-feature account configuration
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_MOBILE_SDK_PASSPHRASE: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}
          MOBILE_BUILD: ${{ !inputs.linux_only && !inputs.windows_only }}
        run: python3 scripts/check_feature_release_config.py
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          VERSION="v${VERSION#v}"
          python3 scripts/check_release_version.py --version "$VERSION"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          # Check if version contains -preview, -beta, -rc, or -alpha (NOT -hotfix)
          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$VERSION_LOWER" == *"-preview"* ]] || [[ "$VERSION_LOWER" == *"-beta"* ]] || [[ "$VERSION_LOWER" == *"-rc"* ]] || [[ "$VERSION_LOWER" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable version: $VERSION"
          fi

  build-android:
    if: ${{ !inputs.linux_only && !inputs.windows_only }}
    runs-on: ubuntu-latest
    needs: get-version
    env:
      SPOTIFLAC_DISCORD_SDK: "1"

    steps:
      - name: Free disk space
        run: |
          # Remove large unused tools (~15GB total). Docker prune was dropped:
          # it took 1-2 minutes and the rm below already frees enough.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Discord SDK
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Configure public release endpoints
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: python scripts/prepare_release_config.py

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Install Rust binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          # Do not publish transforms of the decrypted SDK in shared caches.
          key: gradle-public-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-public-dependencies-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # Install NDK r30 (supports 16KB page size for Android 15+)
          # Keep the installed platform aligned with compileSdk/targetSdk.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: |
          bash scripts/build_android.sh --lite --target lib/main.dart --dart-define-from-file=.release-defines.json
          ls -la build/app/outputs/flutter-apk/

      - name: Sign and verify release APKs (V1/V2/V3/V4)
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/spotiflac-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.p12"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apk_dir=build/app/outputs/flutter-apk

          for target in arm64-v8a:arm64 armeabi-v7a:arm32; do
            abi="${target%%:*}"
            label="${target##*:}"
            apk="$apk_dir/SpotiFLAC-${VERSION}-${label}.apk"
            "$apksigner" sign \
              --ks "$signing_dir/release.p12" \
              --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$apk" "$apk_dir/app-${abi}-release.apk"

            # V4 is written beside the APK as "$apk.idsig" for incremental
            # ADB installs; normal installers keep using V1-V3 inside the APK.
            if [ ! -s "$apk.idsig" ]; then
              echo "ERROR: APK signature V4 file was not created: $apk.idsig" >&2
              exit 1
            fi

            # Verify the app's supported Android versions, then explicitly
            # exercise V1 too: the manifest's minSdk 24 normally skips it.
            "$apksigner" verify "$apk"
            report="$("$apksigner" verify --verbose --print-certs --min-sdk-version 21 \
              --v4-signature-file "$apk.idsig" "$apk")"
            for scheme in 1 2 3 4; do
              if ! grep -Eq "Verified using v${scheme} scheme.*: true" <<< "$report"; then
                echo "ERROR: APK signature V${scheme} did not verify: $apk" >&2
                exit 1
              fi
            done
            if grep -qi "Android Debug" <<< "$report"; then
              echo "ERROR: Refusing to publish a debug-signed APK" >&2
              exit 1
            fi
            printf '%s\n' "$report" | grep -E '^Verifies$|^Verified using v[1234] scheme|certificate SHA-256 digest:'
          done

      - name: Audit signed Rust APKs before upload
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_backend_apk.py'
          audit_flags=()
          if [[ "$SPOTIFLAC_DISCORD_SDK" == "1" ]]; then
            audit_flags+=(--discord-sdk)
          fi
          apk_dir=build/app/outputs/flutter-apk
          python3 scripts/check_backend_apk.py "$apk_dir/SpotiFLAC-${VERSION}-arm64.apk" \
            --backend rust --abis arm64-v8a "${audit_flags[@]}"
          python3 scripts/check_backend_apk.py "$apk_dir/SpotiFLAC-${VERSION}-arm32.apk" \
            --backend rust --abis armeabi-v7a "${audit_flags[@]}"
          for abi in arm64 arm32; do
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 \
              "$apk_dir/SpotiFLAC-${VERSION}-${abi}.apk"
          done
          (cd "$apk_dir" && sha256sum SpotiFLAC-*.apk SpotiFLAC-*.apk.idsig > SHA256SUMS-android.txt)

      - name: Record Android symbol provenance
        run: |
          test -s build/symbols/android/app.android-arm64.symbols
          test -s build/symbols/android/app.android-arm.symbols
          test -s build/app/outputs/mapping/release/mapping.txt
          git rev-parse HEAD > build/symbols/android/commit.txt
          sha256sum build/app/outputs/flutter-apk/SpotiFLAC-*.apk > build/symbols/android/apk-sha256.txt

      - name: Retain Android debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ needs.get-version.outputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/symbols/android/
            build/app/outputs/mapping/release/mapping.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/SpotiFLAC-*.apk
            build/app/outputs/flutter-apk/SpotiFLAC-*.apk.idsig
            build/app/outputs/flutter-apk/SHA256SUMS-android.txt

  build-ios:
    if: ${{ !inputs.linux_only && !inputs.windows_only && !inputs.android_only }}
    runs-on: macos-15-intel
    needs: get-version # Only depends on version, NOT android build!
    env:
      SPOTIFLAC_DISCORD_SDK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Discord SDK
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Configure project Discord callback
        run: python3 scripts/configure_discord_identity.py --ios-plist ios/Runner/Info.plist

      - name: Configure public release endpoints
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: python scripts/prepare_release_config.py

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Build Rust backend for iOS
        run: bash scripts/build_ios.sh

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Pods
          key: pods-rust-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'rust_backend/SpotiFLACBackend.podspec', 'rust_backend/Cargo.lock') }}
          restore-keys: pods-rust-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_audio*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
              echo "Normalized line endings: $f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Configure Rust application pods
        working-directory: ios
        run: |
          pod install

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)" --dart-define-from-file=.release-defines.json

          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Audit Rust iOS archive before packaging
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_backend_ios.py'
          python3 scripts/check_backend_ios.py \
            ios/build/Runner.xcarchive/Products/Applications/Runner.app \
            --dsym ios/build/Runner.xcarchive/dSYMs/Runner.app.dSYM \
            --backend rust --archs arm64 --platform ios --release

      - name: Create IPA
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p build/ios/ipa
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          # Use absolute path to avoid relative path issues
          zip -r "$GITHUB_WORKSPACE/build/ios/ipa/SpotiFLAC-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload

      - name: Verify IPA created
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          ls -la build/ios/ipa/
          if [ ! -f "build/ios/ipa/SpotiFLAC-${VERSION}-ios-unsigned.ipa" ]; then
            echo "ERROR: IPA not created!"
            exit 1
          fi
          (cd build/ios/ipa && shasum -a 256 SpotiFLAC-*.ipa > SHA256SUMS-ios.txt)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: |
            build/ios/ipa/SpotiFLAC-*.ipa
            build/ios/ipa/SHA256SUMS-ios.txt

  # Desktop builds mirror .github/workflows/desktop.yml without its Cargo
  # cache, then package: a universal dmg (ad hoc signed, not notarized),
  # AppImage and deb per Linux architecture, and a Windows installer and
  # portable zip. Each job uploads SHA256SUMS-<target>.txt for create-release.
  build-macos:
    if: ${{ !inputs.linux_only && !inputs.windows_only && !inputs.android_only }}
    name: Build macOS (universal)
    runs-on: macos-15-intel
    needs: get-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure public release endpoints
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: python scripts/prepare_release_config.py

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: bash scripts/build_rust_backend.sh desktop

      # The from-source LGPL build only changes with the script, which pins
      # every source archive.
      - name: Cache LGPL FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg/macos-universal
          key: ffmpeg-macos-universal-${{ hashFiles('scripts/fetch_desktop_ffmpeg.sh') }}

      - name: Build LGPL FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_desktop_ffmpeg.sh macos-universal

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # A stable self-signed identity keeps keychain access across updates.
      # Without the secrets the build stays ad hoc signed.
      - name: Set up the signing identity
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          identity="$(bash scripts/setup_macos_signing.sh)"
          echo "SPOTIFLAC_CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # The Xcode "Embed Rust Backend" and "Embed FFmpeg" phases embed the
      # library and the FFmpeg tools built above.
      - name: Build macOS app
        env:
          SPOTIFLAC_SKIP_RUST_BUILD: "1"
          SPOTIFLAC_REQUIRE_FFMPEG: "1"
        run: |
          flutter build macos --release --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)" --dart-define-from-file=.release-defines.json

      - name: Package disk image
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          app="build/macos/Build/Products/Release/SpotiFLAC.app"
          test -s "$app/Contents/Frameworks/libspotiflac_desktop.dylib"
          for tool in ffmpeg ffprobe; do
            test -x "$app/Contents/Resources/ffmpeg/$tool"
            for arch in arm64 x86_64; do
              lipo "$app/Contents/Resources/ffmpeg/$tool" -verify_arch "$arch"
            done
          done
          bash scripts/package_macos_dmg.sh "$app" "build/desktop/SpotiFLAC-${VERSION}-macos-universal.dmg"
          (cd build/desktop && shasum -a 256 SpotiFLAC-*.dmg > SHA256SUMS-macos.txt)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-macos
          if-no-files-found: error
          path: |
            build/desktop/SpotiFLAC-*.dmg
            build/desktop/SHA256SUMS-macos.txt

  build-linux:
    if: ${{ !inputs.windows_only && !inputs.android_only }}
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            flutter_arch: x64
            runner: ubuntu-22.04
          - arch: aarch64
            deb_arch: arm64
            flutter_arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build dependencies as desktop.yml, plus the desktop entry and
      # AppStream validators and dpkg-shlibdeps for the deb.
      - name: Configure public release endpoints
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: python scripts/prepare_release_config.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # The image's libunwind-14-dev blocks GStreamer's libunwind-dev
          # dependency; asking for it first lets apt replace the LLVM one.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            clang gcc g++ make nasm cmake ninja-build pkg-config zip file libgnutls28-dev \
            libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev \
            libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev libclang-dev \
            desktop-file-utils appstream dpkg-dev libmpv-dev \
            libmp3lame0 libopencore-amrnb0 libopus0 libshine3 libspeex1 \
            libtwolame0 libvo-amrwbenc0 libvorbis0a libvorbisenc2

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: bash scripts/build_rust_backend.sh desktop

      - name: Fetch LGPL FFmpeg
        run: bash scripts/fetch_desktop_ffmpeg.sh "linux-${{ matrix.flutter_arch }}"

      - name: Build baseline-compatible SMB library
        run: bash scripts/build_linux_smb2.sh

      - name: Setup Flutter
        if: matrix.flutter_arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      # Flutter publishes no Linux arm64 SDK archive; a clone of the release
      # tag downloads the arm64 Dart SDK and engine on first run.
      - name: Setup Flutter (arm64)
        if: matrix.flutter_arch == 'arm64'
        run: |
          flutter_version="$(jq -r .flutter .fvmrc)"
          git clone --depth 1 --branch "$flutter_version" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # linux/CMakeLists.txt installs the Rust library into lib/ and the
      # FFmpeg tools staged above into lib/ffmpeg/.
      - name: Build Linux bundle
        run: |
          flutter build linux --release --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)" --dart-define-from-file=.release-defines.json

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate linux/packaging/com.spotiflac.app.desktop
          appstreamcli validate --no-net --explain linux/packaging/com.spotiflac.app.metainfo.xml ||
            echo "::warning::AppStream metadata has validation issues"

      - name: Test isolated search and audio download provider
        if: matrix.flutter_arch == 'x64'
        timeout-minutes: 3
        run: |
          bundle="build/linux/x64/release/bundle"
          python3 scripts/smoke_test_desktop_provider.py --library "$bundle/lib/libspotiflac_desktop.so" --ffmpeg "$bundle/lib/ffmpeg/ffmpeg" --ffprobe "$bundle/lib/ffmpeg/ffprobe" --report-dir "${{ runner.temp }}/spotiflac-provider-smoke"

      - name: Save isolated provider test report
        if: ${{ always() && matrix.flutter_arch == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-smoke-linux-x64
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/spotiflac-provider-smoke/**/result.json

      - name: Package AppImage and deb
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.get-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          FLUTTER_ARCH: ${{ matrix.flutter_arch }}
        run: |
          bundle="build/linux/${FLUTTER_ARCH}/release/bundle"
          test -x "$bundle/spotiflac"
          test -s "$bundle/lib/libspotiflac_desktop.so"
          test -x "$bundle/lib/ffmpeg/ffmpeg"
          test -x "$bundle/lib/ffmpeg/ffprobe"
          test -s "$bundle/lib/ffmpeg/LICENSE.txt"
          export SPOTIFLAC_PACKAGE_ARCH="$ARCH"
          bash scripts/package_linux.sh appimage "$bundle" "$VERSION" \
            "build/desktop/SpotiFLAC-${VERSION}-linux-${ARCH}.AppImage"
          bash scripts/package_linux.sh deb "$bundle" "$VERSION" \
            "build/desktop/SpotiFLAC-${VERSION}-linux-${DEB_ARCH}.deb"
          dpkg-deb --contents "build/desktop/SpotiFLAC-${VERSION}-linux-${DEB_ARCH}.deb" |
            grep -E 'usr/share/applications/com.spotiflac.app.desktop|usr/lib/spotiflac/spotiflac$'
          file "build/desktop/SpotiFLAC-${VERSION}-linux-${ARCH}.AppImage"
          (cd build/desktop && sha256sum SpotiFLAC-* > "SHA256SUMS-linux-${ARCH}.txt")

      - name: Verify Debian installation on Ubuntu 24.04
        run: |
          docker run --rm \
            -v "$PWD/build/desktop:/packages:ro" \
            -v "$PWD/scripts:/checks:ro" \
            ubuntu:24.04 bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb python3 binutils
              LD_LIBRARY_PATH=/usr/lib/spotiflac/lib python3 /checks/verify_linux_installed.py
            '

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/desktop/SpotiFLAC-*.AppImage
            build/desktop/SpotiFLAC-*.deb
            build/desktop/SHA256SUMS-linux-*.txt

  build-windows:
    if: ${{ !inputs.linux_only && !inputs.android_only }}
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    needs: get-version
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      # Signing runs only once SignPath approves the project and the token is
      # configured; until then the installer ships unsigned.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure public release endpoints
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: python scripts/prepare_release_config.py

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: ./scripts/build_rust_backend_windows.ps1 -Target ${{ matrix.rust_target }}

      # Git Bash provides curl, unzip and sha256sum for the fetch script.
      - name: Fetch LGPL FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_desktop_ffmpeg.sh windows-${{ matrix.arch }}

      - name: Setup Flutter
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup native ARM64 Flutter
        if: matrix.arch == 'arm64'
        run: ./scripts/setup_flutter_windows_arm64.ps1

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ matrix.arch }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # windows/CMakeLists.txt installs the Rust library next to spotiflac.exe
      # and the FFmpeg tools staged above into ffmpeg\.
      - name: Build Windows app
        run: |
          $commit = git rev-parse --short=8 HEAD
          flutter build windows --release --target lib/main.dart --dart-define="GIT_COMMIT=$commit" --dart-define-from-file=.release-defines.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'build\windows\${{ matrix.arch }}\runner\Release'
          ./scripts/check_windows_bundle.ps1 -BundleDir $bundle -Arch ${{ matrix.arch }}
          "SPOTIFLAC_WINDOWS_BUNDLE=$bundle" >> $env:GITHUB_ENV

      - name: Test isolated search and audio download provider
        if: matrix.arch == 'x64'
        timeout-minutes: 3
        run: |
          $bundle = 'build\windows\x64\runner\Release'
          python scripts/smoke_test_desktop_provider.py --library "$bundle\spotiflac_desktop.dll" --ffmpeg "$bundle\ffmpeg\ffmpeg.exe" --ffprobe "$bundle\ffmpeg\ffprobe.exe" --report-dir "${{ runner.temp }}/spotiflac-provider-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save isolated provider test report
        if: ${{ always() && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-smoke-windows-x64
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/spotiflac-provider-smoke/**/result.json

      - name: Upload unsigned app for signing
        id: unsigned-app
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-app-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/windows/${{ matrix.arch }}/runner/Release/

      - name: Sign app executables
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/windows-signed

      - name: Use signed app
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          if (-not (Test-Path 'build\windows-signed\spotiflac.exe')) { throw 'Signed app is missing' }
          "SPOTIFLAC_WINDOWS_BUNDLE=build\windows-signed" >> $env:GITHUB_ENV

      - name: Package installer and portable zip
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: ./scripts/package_windows.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -BundleDir $env:SPOTIFLAC_WINDOWS_BUNDLE

      - name: Upload unsigned installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-installer-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/desktop/SpotiFLAC-*-setup.exe

      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/desktop

      - name: Record checksums
        run: |
          $lines = Get-ChildItem build\desktop -File -Filter 'SpotiFLAC-*' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          if (-not $lines) { throw 'No Windows packages were created' }
          [IO.File]::WriteAllText("$PWD\build\desktop\SHA256SUMS-windows-${{ matrix.arch }}.txt", (($lines -join "`n") + "`n"))
          Get-Content build\desktop\SHA256SUMS-windows-${{ matrix.arch }}.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/desktop/SpotiFLAC-*-setup.exe
            build/desktop/SpotiFLAC-*-portable.zip
            build/desktop/SHA256SUMS-windows-${{ matrix.arch }}.txt

  # One release contains every successfully built platform and one checksum file.
  create-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-android, build-ios, build-macos, build-linux, build-windows]
    if: >-
      ${{ !inputs.build_only && !inputs.windows_only && !inputs.linux_only && !inputs.android_only && !cancelled() && (needs.build-android.result == 'success'
      || needs.build-ios.result == 'success' || needs.build-macos.result == 'success'
      || needs.build-linux.result == 'success' || needs.build-windows.result == 'success') }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download Android packages
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-apk
          path: release
      - name: Download iOS package
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-ipa
          path: release
      - name: Download desktop packages
        if: needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: release
      - name: Verify packages and prepare unified release
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
        run: python3 scripts/prepare_release.py release --version "$RELEASE_VERSION"
      - name: Create unified release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: SpotiFLAC ${{ needs.get-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/SpotiFLAC-*
            release/SHA256SUMS.txt
          # Public distribution uses publish_distribution.py after verification.
          draft: true
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
