name: Inspect synthetic release GUI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42468204499
          name: desktop-release-linux-x86_64
          path: package
      - name: Verify and inspect isolated fixture UI
        run: |
          (cd package && sha256sum -c SHA256SUMS-linux-*.txt)
          mkdir evidence
          docker run --rm -v "$PWD/package:/packages:ro" -v "$PWD/scripts:/checks:ro" -v "$PWD/evidence:/evidence" ubuntu:22.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb python3 python3-pyatspi xvfb x11-utils imagemagick gnome-keyring libsecret-tools xdotool libglib2.0-bin gsettings-desktop-schemas at-spi2-core
            export LD_LIBRARY_PATH=/usr/lib/spotiflac/lib
            dbus-run-session -- xvfb-run -a python3 /checks/inspect_release_gui.py
          '
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-release-gui
          path: evidence
