name: Final Linux branding packages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Final Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            flutter_arch: x64
            deb_arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            flutter_arch: arm64
            deb_arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify version and native provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_release_version.py --version v5.2.6
          gh api repos/spotiflac-app/spotiflac/actions/runs/42468204499 > "$RUNNER_TEMP/native-run.json"
          python3 -c 'import os,json; d=json.load(open(os.environ["RUNNER_TEMP"]+"/native-run.json")); assert d["head_sha"]=="a6f8660daf37e0e71676a12b44ef484150caef72" and d["conclusion"]=="success"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42468204499
          name: desktop-release-linux-${{ matrix.arch }}
          path: native-package
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y ./native-package/*.deb clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev dpkg-dev
      - name: Stage verified native components
        run: bash scripts/stage_verified_linux_native.sh '${{ matrix.flutter_arch }}'
      - name: Setup Flutter
        if: matrix.flutter_arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Setup Flutter ARM64
        if: matrix.flutter_arch == 'arm64'
        run: |
          version="$(jq -r .flutter .fvmrc)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-
      - name: Build final branded app
        run: |
          python3 scripts/prepare_release_config.py --repository spotiflac-app/spotiflac-releases
          flutter pub get
          dart scripts/prepare_flutter_sdk.dart
          flutter build linux --release --target lib/main.dart --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)" --dart-define-from-file=.release-defines.json
      - name: Package final branded app
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFLAC_PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          bundle='build/linux/${{ matrix.flutter_arch }}/release/bundle'
          bash scripts/package_linux.sh appimage "$bundle" v5.2.6 'package/SpotiFLAC-v5.2.6-linux-${{ matrix.arch }}.AppImage'
          bash scripts/package_linux.sh deb "$bundle" v5.2.6 'package/SpotiFLAC-v5.2.6-linux-${{ matrix.deb_arch }}.deb'
          (cd package && sha256sum SpotiFLAC-* > 'SHA256SUMS-linux-${{ matrix.arch }}.txt')
      - name: Upload final Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-release-linux-${{ matrix.arch }}
          path: package/*
