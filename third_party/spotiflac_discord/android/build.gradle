group 'com.spotiflac.app.discord'
version '1.0'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def discordSdkEnabled = System.getenv('SPOTIFLAC_DISCORD_SDK') != '0'
def discordApplicationId = System.getenv('SPOTIFLAC_DISCORD_APPLICATION_ID') ?: '0'
if (!(discordApplicationId ==~ /[0-9]+/)) {
    throw new GradleException('SPOTIFLAC_DISCORD_APPLICATION_ID must contain decimal digits')
}

android {
    namespace 'com.spotiflac.app.discord'
    compileSdk 37
    ndkVersion '30.0.16248370'
    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                    "-DSPOTIFLAC_DISCORD_SDK=${discordSdkEnabled ? 'ON' : 'OFF'}",
                    "-DSPOTIFLAC_DISCORD_APPLICATION_ID=${discordApplicationId}"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlinOptions { jvmTarget = '25' }
    if (discordSdkEnabled) sourceSets.main.assets.srcDir('../sdk/notices')
    externalNativeBuild {
        cmake { path 'CMakeLists.txt'; version '4.1.2' }
    }
}
